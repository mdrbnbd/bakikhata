<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>dFaster Note — ডিজিটাল দোকানের হিসাব</title>
<meta name="description" content="dFaster Note: দোকানের বাকি, ক্রয়-বিক্রয়, ক্যাশবক্স ও খরচের হিসাব — বাংলায়, ইন্টারনেট ছাড়াই।">
<meta name="theme-color" content="#0b6e4f">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<header class="top">
  <div class="brand" id="brand">
    <img class="logo" src="icons/icon-192.png" alt="">
    <div><h1 id="shopTitle">dFaster Note</h1><small id="subTitle" class="muted">ডিজিটাল দোকানের হিসাব</small></div>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="থিম বদলান"><svg class="ic"><use href="#i-moon"/></svg></button>
  <button class="icon-btn" id="setBtn" aria-label="সেটিংস"><svg class="ic"><use href="#i-settings"/></svg></button>
  <button class="me-btn" id="meBtn" aria-label="প্রোফাইল"></button>
</header>

<main id="view" aria-live="polite"></main>
<footer class="credit">Powered by Robin · <a href="https://dfaster.com" target="_blank" rel="noopener">dFaster.com</a></footer>

<nav class="bottom" id="bottomNav">
  <button data-nav="home"><span class="ni"><svg class="ic"><use href="#i-house"/></svg></span>হোম</button>
  <button data-nav="parties"><span class="ni"><svg class="ic"><use href="#i-users"/></svg></span>খাতা</button>
  <button data-nav="trade"><span class="ni"><svg class="ic"><use href="#i-shopping-cart"/></svg></span>বেচাকেনা</button>
  <button data-nav="cash"><span class="ni"><svg class="ic"><use href="#i-wallet"/></svg></span>ক্যাশবক্স</button>
  <button data-nav="reports"><span class="ni"><svg class="ic"><use href="#i-chart-column"/></svg></span>রিপোর্ট</button>
  <button data-nav="profile"><span class="ni"><svg class="ic"><use href="#i-user-round"/></svg></span>প্রোফাইল</button>
</nav>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" id="sheetCard"></div>
</div>

<div id="onboard" class="overlay hidden"></div>
<div id="lock" class="overlay hidden"></div>
<div id="pdfStage" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="filePick" accept="application/json,.json,text/plain" hidden>

<script src="js/icons.js?v=4"></script>
<script src="firebase-config.js"></script>
<script src="js/util.js?v=4"></script>
<script src="js/db.js?v=4"></script>
<script src="js/book.js?v=4"></script>
<script src="js/native.js?v=4"></script>
<script src="js/pay.js?v=4"></script>
<script src="js/notify.js?v=4"></script>
<script src="js/cloud.js?v=4"></script>
<script src="js/pdf.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
